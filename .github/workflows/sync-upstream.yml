name: Sync upstream

# Keeps this fork current with stickerdaniel/linkedin-mcp-server.
#
# The fork carries one addition upstream declined (#997): the get_conversations
# tool in scraping/voyager_messaging.py, plus additive changes to
# scraping/extractor.py and tools/messaging.py. That divergence is permanent, so
# this merges rather than resets, and it only pushes once the tests covering
# that tool still pass. A conflict or a failing test fails the run and leaves
# main alone, which is the point: a red workflow is cheap, a silently broken
# messaging tool is not.

on:
  schedule:
    - cron: "0 7 * * *"   # 03:00 America/New_York; GitHub cron is UTC
  workflow_dispatch:      # and runnable by hand from the Actions tab
    inputs:
      branch:
        description: >-
          Branch to sync. Defaults to main. Point it at a scratch branch to
          rehearse the merge/test/push path without risking main - a nightly
          that has only ever taken the no-op path is untested.
        default: main
        required: false

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}
          fetch-depth: 0      # merges need real history, not a shallow clone

      - name: Name the branch
        run: echo "branch=${{ inputs.branch || 'main' }}" >> "$GITHUB_ENV"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/stickerdaniel/linkedin-mcp-server.git
          git fetch upstream main
          echo "behind=$(git rev-list --count "$branch"..upstream/main)" >> "$GITHUB_ENV"

      - name: Report position
        run: echo "$branch is $behind commit(s) behind upstream/main."

      - name: Merge upstream
        if: env.behind != '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::error::Merge conflict with upstream. $branch is untouched and needs a human."
            git diff --name-only "$branch" upstream/main | sed 's/^/conflicting candidate: /'
            exit 1
          fi

      - name: Install
        if: env.behind != '0'
        uses: astral-sh/setup-uv@v5

      - name: Test the tool this fork exists for
        if: env.behind != '0'
        run: |
          uv run pytest tests/test_voyager_messaging.py tests/scraping/ tests/test_tools.py -q
          # A clean merge is not a working one. If upstream moved something
          # voyager_messaging depends on, this is where it shows.

      - name: Confirm the fork's addition survived
        if: env.behind != '0'
        run: |
          grep -q "async def get_conversations" linkedin_mcp_server/scraping/extractor.py
          grep -q "async def get_conversations" linkedin_mcp_server/scraping/voyager_messaging.py
          echo "get_conversations still present on both the reader and the facade."

      - name: Push
        if: env.behind != '0'
        run: git push origin "HEAD:$branch"
